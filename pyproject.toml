[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ssh-winrm"
version = "0.1.0"
description = "MCP server for Windows administration from Linux via SSH jump host and WinRM/PSRemoting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "windows", "powershell", "winrm", "ssh", "administration"]
dependencies = [
    "mcp>=1.27,<2",  # 2.x has a different low-level Server API
    "asyncssh>=2.23,<3",
]

[project.scripts]
mcp-ssh-winrm = "winrm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/winrm_mcp"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/live_smoke.py --ignore=tests/e2e_mcp.py"
