[ssh]
# Windows management server — hostname, SSH alias from ~/.ssh/config, or IP
host = mgmt-server.example.com
# port = 22

# SSH user (optional if set in ~/.ssh/config)
# user = administrator

# SSH private key (optional if set in ~/.ssh/config or ssh-agent)
# key = ~/.ssh/id_ed25519

# Temp directory on the management server for script upload
# temp_dir = C:\Temp\mcp-ssh-winrm

# Extra PowerShell module paths (semicolon-separated).
# Prepended as $env:PSModulePath += ";..." before every script.
# Useful for modules installed outside Program Files (e.g. PowerCLI on a non-system drive).
# extra_ps_module_paths = F:\PSModules

# Max seconds to wait for a script to finish before giving up (does not kill
# the remote process, only stops waiting on our end and returns an error).
# command_timeout = 300

# Max seconds to wait for best-effort cleanup (deleting the temp script,
# closing the connection) after the main command finishes or times out.
# cleanup_timeout = 15

# How many extra attempts to make if the initial SSH connection fails
# (network blip, transient DNS/tunnel issue). Only covers connection
# establishment, not commands that already started executing.
# connect_retries = 2
# connect_retry_delay = 3

[domain]
# Domain account used for PSRemoting (Invoke-Command) to remote computers.
# Required only when 'computer' parameter is used in run_powershell.
user = admin@domain.local

# Name of the environment variable holding the password (never put the password here).
# Set it in your shell: export WINRM_MCP_PASSWORD='yourpassword'
password_env = WINRM_MCP_PASSWORD
