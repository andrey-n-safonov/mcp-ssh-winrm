[ssh]
# Windows management server — hostname, SSH alias from ~/.ssh/config, or IP
host = mgmt-server.example.com
# port = 22

# SSH user (optional if set in ~/.ssh/config)
# user = administrator

# SSH private key (optional if set in ~/.ssh/config or ssh-agent)
# key = ~/.ssh/id_ed25519

# Temp directory on the management server for script upload
# temp_dir = C:\Temp\mcp-ssh-winrm

[domain]
# Domain account used for PSRemoting (Invoke-Command) to remote computers.
# Required only when 'computer' parameter is used in run_powershell.
user = admin@domain.local

# Name of the environment variable holding the password (never put the password here).
# Set it in your shell: export WINRM_MCP_PASSWORD='yourpassword'
password_env = WINRM_MCP_PASSWORD
